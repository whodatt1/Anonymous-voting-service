events {
    # 워커 프로세스 1개당 최대 동시 연결 수
    worker_connections 1024;
}

http {
    # 파일 확장자 → Content-Type 헤더 매핑 (.js, .css 등이 올바른 타입으로 전송되도록)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # HTTP → HTTPS 리다이렉트 (80포트로 들어오면 443으로 보냄)
    server {
        listen 80;
        server_name votebox.co.kr;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name votebox.co.kr;

        ssl_certificate /etc/letsencrypt/live/votebox.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/votebox.co.kr/privkey.pem;

        # ── SSE 스트리밍 (/api/votes/{shareCode}/stream) ─────────────────────
        # 실시간 투표 현황을 서버에서 클라이언트로 밀어주는 스트리밍 엔드포인트
        # 일반 API와 별도 처리하는 이유: SSE는 연결을 끊지 않고 계속 데이터를 흘려보냄
        # proxy_buffering off: nginx가 응답을 버퍼에 쌓지 않고 즉시 전달 (실시간 필수)
        # proxy_http_version 1.1 + Connection '': keep-alive 연결 유지
        location ~ ^/api/votes/[^/]+/stream {
            proxy_pass http://app:8080;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # ── Spring Boot API (/api/**) ─────────────────────────────────────────
        # /api/ 로 시작하는 모든 요청을 Spring Boot 컨테이너(app:8080)로 전달
        # React fetch() 호출은 전부 /api/ 로 시작하므로 여기서 처리됨
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # ── React SPA 정적 파일 ───────────────────────────────────────────────
        # Vite 빌드 산출물(JS/CSS)은 파일명에 해시가 포함되어 새 배포 시 파일명이 바뀌므로
        # 브라우저가 강하게 캐시해도 안전 (1년)
        location ~* \.(js|css|woff|woff2|png|jpg|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html은 파일명이 고정이므로 새 배포 후에도 캐시되면 구 JS를 가리킴
        # → 반드시 캐시 금지: 브라우저가 항상 서버에 재요청
        # /api/ 에 해당하지 않는 모든 요청은 React 앱으로
        # try_files: 실제 파일이 있으면 그 파일, 없으면 index.html 반환
        # → React Router가 index.html 로드 후 URL 보고 올바른 화면 렌더링
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
}
